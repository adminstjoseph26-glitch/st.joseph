<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>St Joseph's College | Home</title>
<meta name="description" content="St Joseph's College: online library catalogue (OPAC), E-Library, student registration and college management system.">

<style>
:root{
  --navy:#14284b; --blue:#264a8f; --blue2:#1d3b75; --gold:#c8a24a; --gold-d:#9c7a27;
  --paper:#f4f6fa; --white:#fff; --ink:#1b2333; --muted:#5b6679; --line:#dfe4ee;
  --ok:#1f7a4d; --warn:#a85f00; --bad:#b3261e;
  --head:'Newsreader',Georgia,'Times New Roman',serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --r:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--ink);background:var(--white);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);line-height:1.2;margin:0 0 .5em;font-weight:600}
h1{font-size:clamp(2rem,4.6vw,3.4rem)} h2{font-size:clamp(1.6rem,3vw,2.2rem)} h3{font-size:1.3rem} h4{font-size:1.1rem}
p{margin:0 0 1em}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{width:min(1200px,92%);margin:0 auto}
.sr{position:absolute;left:-9999px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:600 .95rem var(--body);padding:.75rem 1.25rem;border-radius:var(--r);border:2px solid var(--blue);background:var(--blue);color:#fff;cursor:pointer;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--navy);border-color:var(--navy);text-decoration:none;color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.btn.gold:hover{background:#d8b45a;border-color:#d8b45a;color:var(--navy)}
.btn.ghost{background:transparent;color:var(--blue)}
.btn.ghost:hover{background:var(--blue);color:#fff}
.btn.light{background:transparent;border-color:#fff;color:#fff}
.btn.light:hover{background:#fff;color:var(--navy)}
.btn.sm{padding:.4rem .75rem;font-size:.82rem}
.btn.danger{background:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* top strip + header */
.strip{background:var(--navy);color:#cfd8ec;font-size:.85rem}
.strip .wrap{display:flex;justify-content:flex-end;gap:1.4rem;padding:.45rem 0;flex-wrap:wrap}
.strip a,.strip button{color:#cfd8ec;background:none;border:0;font:inherit;cursor:pointer;padding:0}
.strip a:hover,.strip button:hover{color:#fff;text-decoration:underline}
.brandbar{background:#fff;border-bottom:1px solid var(--line)}
.brandbar .wrap{display:flex;align-items:center;gap:1rem;padding:.9rem 0}
.brand{display:flex;align-items:center;gap:.9rem;color:var(--navy);text-decoration:none}
.brand:hover{text-decoration:none}
.brand svg{width:58px;height:58px;flex:none}
.brand b{font:700 1.55rem/1.1 var(--head);display:block}
.brand small{color:var(--muted);font-size:.85rem}
.burger{display:none;margin-left:auto;background:none;border:2px solid var(--navy);border-radius:var(--r);padding:.4rem .6rem;cursor:pointer;color:var(--navy);font-weight:700}
.nav{background:var(--blue);position:sticky;top:0;z-index:40}
.nav ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap}
.nav li{position:relative}
.nav a.top,.nav button.top{display:block;color:#fff;padding:.95rem 1.1rem;font:600 .93rem var(--body);background:none;border:0;cursor:pointer;text-decoration:none}
.nav li:hover>a.top,.nav li:hover>button.top,.nav a.top.on{background:var(--blue2)}
.nav .sub{display:none;position:absolute;left:0;top:100%;min-width:230px;background:#fff;border-top:3px solid var(--gold);box-shadow:0 12px 28px rgba(20,40,75,.18);padding:.4rem 0}
.nav li:hover>.sub,.nav li:focus-within>.sub{display:block}
.nav .sub a{display:block;padding:.6rem 1.1rem;color:var(--ink);font-size:.92rem}
.nav .sub a:hover{background:var(--paper);text-decoration:none;color:var(--blue)}
.nav .right{margin-left:auto;display:flex;align-items:center;padding:.4rem 0}
@media(max-width:900px){
  .burger{display:block}
  .nav{display:none;position:static}
  .nav.open{display:block}
  .nav ul{flex-direction:column}
  .nav .sub{position:static;display:block;box-shadow:none;border:0;background:var(--blue2);padding:0}
  .nav .sub a{color:#dbe5fb;padding-left:2rem}
  .nav .right{padding:.6rem 1rem}
  .brand svg{width:46px;height:46px}.brand b{font-size:1.2rem}
}

/* hero */
.hero{position:relative;height:min(76vh,640px);min-height:430px;background:var(--navy);overflow:hidden}
.slide{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;visibility:hidden}
.slide.on{opacity:1;visibility:visible}
.slide img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(20,40,75,.92) 0%,rgba(20,40,75,.7) 45%,rgba(20,40,75,.15) 100%)}
.slide .copy{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;max-width:640px;color:#fff}
.slide h1{color:#fff;margin-bottom:.4em}
.slide p{font-size:1.12rem;color:#e3eaf9;max-width:52ch}
.slide .row{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:.6rem}
.hctl{position:absolute;z-index:5;bottom:1.4rem;left:0;right:0}
.hctl .wrap{display:flex;gap:.5rem;align-items:center}
.dot{width:34px;height:5px;border:0;background:rgba(255,255,255,.4);cursor:pointer;padding:0}
.dot.on{background:var(--gold)}
.arrow{position:absolute;z-index:5;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.7);background:rgba(20,40,75,.4);color:#fff;font-size:1.3rem;cursor:pointer}
.arrow:hover{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.arrow.l{left:1rem}.arrow.r{right:1rem}
@media(max-width:700px){.arrow{display:none}}

/* sections */
section.sec{padding:4.2rem 0}
section.sec.alt{background:var(--paper)}
.sechead{display:flex;align-items:end;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-bottom:1.8rem}
.sechead h2{margin:0}
.sechead p{margin:.3rem 0 0;color:var(--muted)}
.grid{display:grid;gap:1.5rem}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
@media(max-width:980px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.card .ph{aspect-ratio:16/10;background:linear-gradient(135deg,var(--blue),var(--navy));position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .bd{padding:1.2rem 1.3rem 1.4rem;display:flex;flex-direction:column;flex:1}
.card .bd p{color:var(--muted);font-size:.95rem}
.card .bd .more{margin-top:auto;font-weight:600}
.tag{display:inline-block;background:#e8eefb;color:var(--blue);font-size:.78rem;font-weight:600;padding:.15rem .6rem;border-radius:99px;margin-bottom:.6rem;align-self:flex-start}

.cats .item{border-left:4px solid var(--gold);padding:.2rem 0 .2rem 1.1rem}
.cats .item p{color:var(--muted);margin:0}

.vmm{background:var(--navy);color:#fff}
.vmm h3{color:var(--gold);margin-bottom:.4rem}
.vmm p{color:#dbe5fb;margin:0}
.vmm .grid{gap:2.2rem}

.about-split{display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.about-split img{width:100%;height:100%;max-height:460px;object-fit:cover;border-radius:var(--r);background:var(--navy)}
@media(max-width:860px){.about-split{grid-template-columns:1fr}}
.ticks{list-style:none;padding:0;margin:1rem 0}
.ticks li{padding-left:1.7rem;position:relative;margin-bottom:.55rem}
.ticks li::before{content:"";position:absolute;left:0;top:.5rem;width:.9rem;height:.5rem;border-left:3px solid var(--gold);border-bottom:3px solid var(--gold);transform:rotate(-45deg)}

.statband{background:var(--blue);color:#fff;padding:2.2rem 0}
.statband .grid{text-align:center}
.statband b{font:700 2.4rem var(--head);display:block;color:#fff}
.statband span{color:#cdd9f4;font-size:.95rem}

.listrow{display:flex;gap:1rem;padding:.9rem 0;border-bottom:1px solid var(--line)}
.listrow .badge{align-self:center;flex:none}
.datebox{flex:none;width:62px;text-align:center;background:var(--blue);color:#fff;border-radius:var(--r);padding:.35rem 0;line-height:1.15}
.datebox b{display:block;font:700 1.4rem var(--head)}.datebox span{font-size:.75rem}
.newsimg{aspect-ratio:16/10;background:linear-gradient(135deg,var(--blue),var(--navy));overflow:hidden}
.newsimg img{width:100%;height:100%;object-fit:cover}

.fac{position:relative;border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff}
.fac img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.fac::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,40,75,.92),rgba(20,40,75,0) 62%)}
.fac div{position:absolute;z-index:2;left:1rem;right:1rem;bottom:.9rem}
.fac h4{color:#fff;margin:0}.fac span{font-size:.88rem;color:#dbe5fb}

details.faq{border:1px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:.7rem}
details.faq summary{cursor:pointer;padding:1rem 1.2rem;font-weight:600;color:var(--navy);list-style:none;display:flex;justify-content:space-between;gap:1rem}
details.faq summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--gold-d)}
details.faq[open] summary::after{content:"\2212"}
details.faq p{padding:0 1.2rem 1.1rem;margin:0;color:var(--muted)}

.pagehead{background:linear-gradient(90deg,var(--navy),var(--blue));color:#fff;padding:2.6rem 0}
.pagehead h1{color:#fff;margin:0;font-size:clamp(1.8rem,3.5vw,2.6rem)}
.pagehead p{margin:.4rem 0 0;color:#cdd9f4}
.crumbs{font-size:.85rem;color:#b8c7ea;margin-bottom:.5rem}.crumbs a{color:#fff}

/* forms */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.6rem}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem 1.2rem}
.fgrid .full{grid-column:1/-1}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}}
.field label{display:block;font-weight:600;font-size:.88rem;margin-bottom:.3rem;color:var(--navy)}
.field label i{color:var(--bad);font-style:normal}
.field input,.field select,.field textarea{width:100%;font:inherit;padding:.65rem .75rem;border:1px solid #c5cddd;border-radius:var(--r);background:#fff;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--blue);outline:3px solid #cfdcf7;outline-offset:0}
.field textarea{min-height:110px;resize:vertical}
.field small{color:var(--muted);font-size:.8rem}
fieldset{border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem 1.2rem;margin:0 0 1.2rem}
legend{font:600 1.05rem var(--head);color:var(--navy);padding:0 .5rem}
.note{background:#fff8e6;border:1px solid #efd99a;border-radius:var(--r);padding:.8rem 1rem;font-size:.9rem;color:#5c4a12}
.okbox{background:#eaf6ef;border:1px solid #b7dcc6;border-radius:var(--r);padding:1.4rem}
.formsplit{display:grid;grid-template-columns:1.6fr 1fr;gap:2rem;align-items:start}
@media(max-width:900px){.formsplit{grid-template-columns:1fr}}
.side-img{border-radius:var(--r);overflow:hidden;background:var(--navy);aspect-ratio:4/5}
.side-img img{width:100%;height:100%;object-fit:cover}
.steps{counter-reset:s;list-style:none;padding:0;margin:1rem 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 1rem 2.6rem}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--gold);color:var(--navy);font-weight:700;display:grid;place-items:center;font-size:.9rem}

/* opac */
.searchbar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1.2rem}
.searchbar input{flex:1;min-width:220px}
.res{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:1rem 1.2rem;margin-bottom:.8rem;display:flex;justify-content:space-between;gap:1rem;align-items:center}
.res h4{margin:0 0 .15rem}.res small{color:var(--muted)}
.badge{display:inline-block;font-size:.76rem;font-weight:600;padding:.12rem .6rem;border-radius:99px;white-space:nowrap}
.badge.ok{background:#e1f3e8;color:var(--ok)}.badge.warn{background:#fdf0d8;color:var(--warn)}.badge.bad{background:#fbe3e1;color:var(--bad)}.badge.gray{background:#e9edf4;color:#4a5568}

/* footer */
footer{background:var(--navy);color:#cdd9f4;padding:3.2rem 0 0;margin-top:0}
footer h4{color:#fff;font-size:1.1rem}
footer a{color:#cdd9f4}footer a:hover{color:#fff}
footer ul{list-style:none;padding:0;margin:0}footer li{margin-bottom:.45rem}
footer .copy{border-top:1px solid rgba(255,255,255,.15);margin-top:2rem;padding:1rem 0;font-size:.85rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.sub-form{display:flex;gap:.5rem}.sub-form input{flex:1;min-width:0;padding:.6rem .7rem;border-radius:var(--r);border:0;font:inherit}

/* dashboard */
.dash{display:grid;grid-template-columns:260px 1fr;min-height:100vh;background:var(--paper)}
.side{background:var(--navy);color:#cdd9f4;padding:1.2rem 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.side .brand{padding:0 1.2rem 1.2rem;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:.8rem}
.side .brand b{color:#fff;font-size:1.15rem}.side .brand small{color:#9fb1d8}
.side .brand svg{width:44px;height:44px}
.side nav a{display:flex;align-items:center;gap:.7rem;padding:.7rem 1.2rem;color:#cdd9f4;font-weight:500;font-size:.95rem;border-left:4px solid transparent}
.side nav a:hover{background:rgba(255,255,255,.06);text-decoration:none;color:#fff}
.side nav a.on{background:rgba(255,255,255,.1);border-left-color:var(--gold);color:#fff}
.side nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side .grp{padding:.9rem 1.2rem .3rem;font-size:.75rem;color:#8ea2cf;letter-spacing:.04em}
.dmain{min-width:0}
.dtop{background:#fff;border-bottom:1px solid var(--line);padding:.8rem 1.6rem;display:flex;align-items:center;gap:1rem;position:sticky;top:0;z-index:30}
.dtop h2{margin:0;font-size:1.4rem}
.dtop .sp{flex:1}
.dtop .who{font-size:.9rem;text-align:right;line-height:1.3}.dtop .who small{color:var(--muted)}
.dburger{display:none;background:none;border:2px solid var(--navy);border-radius:var(--r);padding:.3rem .6rem;font-weight:700;color:var(--navy);cursor:pointer}
.dbody{padding:1.6rem}
@media(max-width:960px){
  .dash{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:270px;z-index:60;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .dburger{display:block}
  .dbody{padding:1rem}
  .scrim{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:55}
}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1rem;margin-bottom:1.4rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;border-top:4px solid var(--blue)}
.stat b{font:700 2rem var(--head);color:var(--navy);display:block;line-height:1.1}
.stat span{color:var(--muted);font-size:.88rem}
.stat.g{border-top-color:var(--gold)}.stat.r{border-top-color:var(--bad)}.stat.o{border-top-color:var(--ok)}
.dgrid{display:grid;grid-template-columns:1.4fr 1fr;gap:1.2rem}
@media(max-width:1100px){.dgrid{grid-template-columns:1fr}}
.tools{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.tools input[type=search],.tools select{padding:.55rem .75rem;border:1px solid #c5cddd;border-radius:var(--r);font:inherit;background:#fff}
.tools input[type=search]{flex:1;min-width:200px}
.tools .sp{flex:1}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th{background:#eef2f9;text-align:left;padding:.7rem .9rem;font-weight:600;color:var(--navy);white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:.65rem .9rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fafbfe}
td .acts{display:flex;gap:.35rem;flex-wrap:nowrap}
.empty{padding:2.4rem 1rem;text-align:center;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:150px 1fr 36px;gap:.7rem;align-items:center;margin-bottom:.7rem;font-size:.88rem}
.bars .track{background:#e9edf4;height:14px;border-radius:99px;overflow:hidden}
.bars .fill{display:block;height:100%;background:var(--blue);border-radius:99px}
@media(max-width:560px){.bars .row{grid-template-columns:100px 1fr 30px}}
.modalback{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:100;display:grid;place-items:center;padding:1rem;overflow-y:auto}
.modal{background:#fff;border-radius:var(--r);width:min(680px,100%);max-height:94vh;overflow-y:auto;padding:1.5rem;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.modal h3{margin-bottom:1rem}
.modal .foot{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1.2rem}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:.75rem 1.2rem;border-radius:var(--r);z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:92%}
.toast.err{background:var(--bad)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:.45rem 1rem;font-size:.95rem}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:500}
@media(max-width:560px){.kv{grid-template-columns:1fr}}
.loginwrap{min-height:70vh;display:grid;place-items:center;padding:3rem 1rem;background:var(--paper)}
.loginbox{width:min(440px,100%)}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{position:absolute;left:0;top:0;width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

/* All data lives in Cloudflare D1 (database) and R2 (files). The browser only keeps a cached copy in `db`. */
async function api(path, { method = "GET", body, form } = {}) {
  const opt = { method, credentials: "same-origin", headers: {} };
  if (form) opt.body = form;
  else if (body !== undefined) { opt.headers["content-type"] = "application/json"; opt.body = JSON.stringify(body); }
  let res;
  try { res = await fetch("/api" + path, opt); }
  catch (e) { throw new Error("Cannot reach the server. Check your internet connection."); }
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== "/login") { db.me = null; location.hash = "#/login"; }
  if (!res.ok) throw new Error(data.error || "Something went wrong (" + res.status + ").");
  return data;
}
async function refresh() { db = await api("/bootstrap"); }
let busy = false;
async function act(fn, okMsg) {
  if (busy) return false;
  busy = true;
  try { await fn(); await refresh(); render(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(e.message, true); return false; }
  finally { busy = false; }
}

function toast(msg, err) {
  const d = document.createElement("div");
  d.className = "toast" + (err ? " err" : ""); d.setAttribute("role", "status"); d.textContent = msg;
  document.body.appendChild(d); setTimeout(() => d.remove(), 3400);
}
function closeModal() { $("#layer").innerHTML = ""; }
function modal(title, body, onSubmit, okLabel = "Save changes") {
  $("#layer").innerHTML = `<div class="modalback" data-act="modalback"><form class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <h3>${esc(title)}</h3>${body}
    <div class="foot"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button>${onSubmit ? `<button class="btn">${esc(okLabel)}</button>` : ""}</div></form></div>`;
  const f = $("#layer form");
  const first = $("input,select,textarea", f); if (first) first.focus();
  f.addEventListener("submit", async e => {
    e.preventDefault();
    if (!onSubmit) return;
    const data = Object.fromEntries(new FormData(f));
    const r = await onSubmit(data, f);
    if (r !== false) closeModal();
  });
}
function csv(name, cols, rows) {
  const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
  const text = [cols.map(q).join(","), ...rows.map(r => r.map(q).join(","))].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
}
const fld = (label, name, o = {}) => {
  const req = o.required ? " required" : "";
  const star = o.required ? " <i>*</i>" : "";
  const cls = "field" + (o.full ? " full" : "");
  let input;
  if (o.options) input = `<select name="${name}"${req}>${o.placeholder ? `<option value="">${esc(o.placeholder)}</option>` : ""}${o.options.map(x => { const [v, l] = Array.isArray(x) ? x : [x, x]; return `<option value="${esc(v)}"${String(o.value) === String(v) ? " selected" : ""}>${esc(l)}</option>`; }).join("")}</select>`;
  else if (o.textarea) input = `<textarea name="${name}"${req}>${esc(o.value)}</textarea>`;
  else input = `<input name="${name}" type="${o.type || "text"}" value="${esc(o.value)}"${req}${o.min != null ? ` min="${o.min}"` : ""}${o.max != null ? ` max="${o.max}"` : ""}${o.minlength ? ` minlength="${o.minlength}"` : ""}${o.autocomplete ? ` autocomplete="${o.autocomplete}"` : ""}${o.pattern ? ` pattern="${o.pattern}"` : ""}${o.accept ? ` accept="${o.accept}"` : ""}>`;
  return `<div class="${cls}"><label>${esc(label)}${star}</label>${input}${o.hint ? `<small>${esc(o.hint)}</small>` : ""}</div>`;
};

function bookAvail(b) {
  const out = b.out || 0; // counted on the server so it is correct for every visitor
  return { out, left: Math.max(0, b.copies - out) };
}
function opacList(q, cat) {
  q = q.toLowerCase();
  const r = db.books.filter(b => (!cat || b.category === cat) && (!q || [b.title, b.author, b.call, b.category].join(" ").toLowerCase().includes(q)));
  if (!r.length) return `<div class="empty">No books match your search. Try a different word or choose All subjects.</div>`;
  return `<p style="color:var(--muted)">${r.length} ${r.length === 1 ? "result" : "results"}</p>` + r.map(b => {
    const a = bookAvail(b);
    return `<div class="res"><div><h4>${esc(b.title)}</h4><small>${esc(b.author)} &middot; ${esc(b.category)} &middot; Call no. ${esc(b.call)}</small></div>
      <span class="badge ${a.left ? "ok" : "bad"}">${a.left ? `${t("Available")} (${a.left} of ${b.copies})` : t("On loan")}</span></div>`;
  }).join("");
}

function dOverview() {
  const overdue = db.loans.filter(l => !l.returned && l.due < today());
  const pending = db.students.filter(s => s.status === "Pending");
  const out = db.loans.filter(l => !l.returned).length;
  const counts = PROGRAMMES.map(p => [p.name.replace(/^(Certificate|Diploma) in /, ""), db.students.filter(s => s.programme === p.code).length]);
  const max = Math.max(1, ...counts.map(c => c[1]));
  const recent = [...db.students].sort((a, b) => b.registered.localeCompare(a.registered)).slice(0, 5);
  return `<div class="stats">
    <div class="stat"><b>${db.students.length}</b><span>Students registered</span></div>
    <div class="stat g"><b>${pending.length}</b><span>Waiting for approval</span></div>

    <div class="stat g"><b>${db.ebooks.length}</b><span>E-Library items</span></div></div>
  <div class="dgrid">
    <div class="panel"><h3>Students by programme</h3><div class="bars">${counts.map(c => `<div class="row"><span>${esc(c[0])}</span><span class="track"><span class="fill" style="width:${c[1] / max * 100}%"></span></span><b>${c[1]}</b></div>`).join("")}</div></div>
    <div class="panel"><h3>Recent registrations</h3>${recent.length ? recent.map(s => `<div class="listrow" style="padding:.6rem 0"><div style="flex:1"><strong>${esc(fullName(s))}</strong><br><small style="color:var(--muted)">${esc(s.adm)} &middot; ${fmt(s.registered)}</small></div>${badge(s.status)}</div>`).join("") : `<div class="empty">No registrations yet.</div>`}

  const rows = sorted.map(g => { const s = stu(g.studentId); return `<tr data-s="${esc(((s ? fullName(s) : "") + " " + g.course + " " + g.term).toLowerCase())}"><td>${esc(s ? fullName(s) : "Removed student")}</td><td>${esc(g.course)}</td><td>${esc(g.term)}</td><td>${g.score}</td><td><span class="badge ${g.score >= 40 ? "ok" : "bad"}">${gradeLetter(g.score)}</span></td><td><div class="acts"><button class="btn sm ghost" data-act="editGrade" data-id="${g.id}">Edit</button><button class="btn sm danger" data-act="delGrade" data-id="${g.id}">Delete</button></div></td></tr>`; }).join("");
  const avgs = db.students.map(s => { const g = db.grades.filter(x => x.studentId === s.id); return { s, n: g.length, avg: g.length ? g.reduce((a, b) => a + b.score, 0) / g.length : null }; }).filter(x => x.n).sort((a, b) => b.avg - a.avg);
  return `<div class="dgrid"><div>
    <div class="tools"><input type="search" placeholder="Search by student, course or term" aria-label="Search results" data-rows="#grbody"><span class="sp"></span><button class="btn sm" data-act="addGrade">Record a result</button></div>
    <div class="tw"><table><thead><tr><th>Student</th><th>Course</th><th>Term</th><th>Score</th><th>Grade</th><th>Actions</th></tr></thead><tbody id="grbody">${rows}</tbody></table>${rows ? "" : `<div class="empty">No results recorded yet.</div>`}</div></div>
    <div class="panel"><h3>Average score by student</h3><div class="bars">${avgs.map(a => `<div class="row"><span>${esc(a.s.first + " " + a.s.last)}</span><span class="track"><span class="fill" style="width:${a.avg}%;background:${a.avg >= 40 ? "var(--blue)" : "var(--bad)"}"></span></span><b>${Math.round(a.avg)}</b></div>`).join("") || `<div class="empty">No data yet.</div>`}</div>
    <p style="color:var(--muted);font-size:.85rem;margin:.8rem 0 0">Grades: A 70+, B 60+, C 50+, D 40+, F below 40.</p></div></div>`;
}

/* =========================================================
   Router + render
   ========================================================= */
let slideTimer = null, curSlide = 0;
function render() {
  clearInterval(slideTimer);
  const raw = location.hash.replace(/^#\/?/, "") || "home";
  const [pathPart] = raw.split("?");
  const [p, sub] = pathPart.split("/");
  const app = $("#app");
  const titles = { home: "Home", about: "About", programmes: "Programmes", library: "Library", opac: "Online Catalogue", elibrary: "E-Library", news: "News and events", contact: "Contact", register: "Student registration", login: "Sign in", dashboard: "Portal", faqs: "FAQs" };
  document.title = `${SITE.name} | ${titles[p] || "Home"}`;
  document.documentElement.lang = lang === "sw" ? "sw" : "en";
  const pub = (inner, a) => publicShell(inner, a);
  let html;
  switch (p) {
    case "about": html = pub(pageAbout(), "about"); break;
    case "programmes": html = pub(pageProgrammes(), "programmes"); break;
    case "library": html = pub(pageLibrary(), "library"); break;
    case "opac": html = pub(pageOpac(), "library"); break;
    case "elibrary": html = pub(pageElibrary(), "library"); break;
    case "news": html = pub(pageNews(), "news"); break;
    case "contact": html = pub(pageContact(), "contact"); break;
    case "faqs": html = pub(pageFaqs(), ""); break;
    case "register": html = pub(pageRegister(), "programmes"); break;
    case "login": html = me() ? (location.hash = "#/dashboard", "") : pub(pageLogin(), ""); break;
    case "dashboard": html = pageDashboard(sub); break;
    default: html = pub(pageHome(), "home");
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
  if ($(".hero")) { curSlide = 0; slideTimer = setInterval(() => goSlide(curSlide + 1), 6500); }
}
function goSlide(i) {
  const s = $$(".slide"); if (!s.length) return;
  curSlide = (i + s.length) % s.length;
  s.forEach((x, k) => x.classList.toggle("on", k === curSlide));
  $$(".dot").forEach((x, k) => x.classList.toggle("on", k === curSlide));
}

const actions = {
  lang() { lang = lang === "sw" ? "en" : "sw"; store.set("sjc_lang", lang); render(); },
  burger(el) { const n = $("#mainnav"); const o = n.classList.toggle("open"); el.setAttribute("aria-expanded", o); },
  dburger() { const s = $("#side"); s.classList.toggle("open"); if (s.classList.contains("open")) { const sc = document.createElement("div"); sc.className = "scrim"; sc.dataset.act = "dburger"; sc.id = "scrim"; document.body.appendChild(sc); } else $("#scrim")?.remove(); },
  slide(el) { goSlide(curSlide + Number(el.dataset.d)); clearInterval(slideTimer); },
  goslide(el) { goSlide(Number(el.dataset.i)); clearInterval(slideTimer); },
  async logout() { try { await api("/logout", { method: "POST" }); } catch (e) {} try { await refresh(); } catch (e) {} location.hash = "#/home"; render(); toast("You have signed out."); },
  closeModal,
  modalback(el, e) { if (e.target === el) closeModal(); },

  addStudent() { modal("Add student", studentFormBody(), d => act(() => api("/students", { method: "POST", body: d }), "Student added.")); },

  },
  approve(el) { act(() => api("/students/" + el.dataset.id + "/approve", { method: "POST" }), "Student approved."); },
  delStudent(el) {
    const s = stu(el.dataset.id);
    modal("Delete student", `<p>Delete <strong>${esc(fullName(s))}</strong> (${esc(s.adm)})? Their results, loans and login will also be removed. This cannot be undone.</p>`,

  addBook() { modal("Add book", bookFormBody(), d => act(() => api("/books", { method: "POST", body: d }), "Book added.")); },

  delBook(el) { const b = book(el.dataset.id); modal("Delete book", `<p>Delete <strong>${esc(b.title)}</strong> from the catalogue?</p>`, () => act(() => api("/books/" + b.id, { method: "DELETE" }), "Book deleted."), "Delete"); },
  exportBooks() { const r = REPORTS.inventory[1](); csv("library-inventory.csv", r.cols, r.rows); },

    const avail = db.books.filter(b => bookAvail(b).left > 0), studs = db.students.filter(s => s.status === "Active");

  delEbook(el) { modal("Delete resource", "<p>Delete this digital resource and its file?</p>", () => act(() => api("/ebooks/" + el.dataset.id, { method: "DELETE" }), "Resource deleted."), "Delete"); },

  repsel(el) { curReport = el.value; render(); },
  repcsv() { const r = REPORTS[curReport][1](); csv(curReport + "-report.csv", r.cols, r.rows); },
  repprint() { window.print(); },
  exportAll() {
    const { students, grades, books, ebooks, loans, messages, subscribers } = db;
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ students, grades, books, ebooks, loans, messages, subscribers }, null, 2)], { type: "application/json" }));
    a.download = "sjc-backup.json"; a.click();
  }
};

async function saveEbook(d, _f, existing) {
  const file = $("#layer input[type=file]")?.files[0];
  if (file && file.size > 20 * 1024 * 1024) { toast("The file is larger than 20 MB.", true); return false; }
  const fd = new FormData();
  ["title", "author", "category", "format"].forEach(k => fd.append(k, d[k] ?? ""));
  if (file) fd.append("file", file);
  return act(() => api(existing ? "/ebooks/" + existing.id : "/ebooks", { method: existing ? "PUT" : "POST", form: fd }), "Saved to the E-Library.");
}

document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a && actions[a.dataset.act]) { if (a.tagName !== "SELECT") actions[a.dataset.act](a, e); }
  const nl = e.target.closest("#mainnav a");
  if (nl) $("#mainnav")?.classList.remove("open");
  const sl = e.target.closest("#side a");
  if (sl) { $("#side")?.classList.remove("open"); $("#scrim")?.remove(); }
});
document.addEventListener("change", e => {
  const a = e.target.closest("select[data-act]");
  if (a && actions[a.dataset.act]) actions[a.dataset.act](a, e);
  if (e.target.matches("[data-rowsel]")) filterRows($(e.target.dataset.rowsel), $("[data-rows]")?.value || "", e.target.value);
  if (e.target.matches("[data-live=opac]")) $("#opacres").innerHTML = opacList($("#opacq").value, $("#opaccat").value);
});
function filterRows(tb, q, st) {
  if (!tb) return; q = (q || "").toLowerCase(); st = (st || "").toLowerCase();
  [...tb.rows].forEach(r => { const s = r.dataset.s || r.textContent.toLowerCase(); r.hidden = !(s.includes(q) && (!st || s.includes(st))); });
}
document.addEventListener("input", e => {
  if (e.target.matches("[data-rows]")) { const sel = $("[data-rowsel]"); filterRows($(e.target.dataset.rows), e.target.value, sel ? sel.value : ""); }
  if (e.target.matches("[data-live=opac]")) $("#opacres").innerHTML = opacList($("#opacq").value, $("#opaccat").value);
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.style.visibility = "hidden"; }, true);

document.addEventListener("submit", async e => {
  const f = e.target.closest("[data-form]"); if (!f) return;
  e.preventDefault();
  const d = Object.fromEntries(new FormData(f)); const kind = f.dataset.form;
  const btn = f.querySelector("button:not([type=button])"); if (btn) btn.disabled = true;
  try {
    if (kind === "login") {
      try { await api("/login", { method: "POST", body: { email: d.email, password: d.password } }); }
      catch (err) { $("#loginerr").textContent = err.message; return; }
      await refresh(); location.hash = "#/dashboard"; render(); return;
    }
    if (kind === "register") {
      if (d.password !== d.password2) { toast("The two passwords do not match.", true); return; }
      const em = d.email.trim().toLowerCase();
      const r = await api("/register", { method: "POST", body: d });
      $("#regpanel").innerHTML = `<div class="okbox"><h2>Registration received</h2><p>Thank you, <strong>${esc(r.first)}</strong>. Your admission number is:</p>
        <p style="font:700 2rem var(--head);color:var(--navy);margin:.2rem 0 1rem">${esc(r.adm)}</p>
        <p>Keep this number. The college office will confirm your registration. You can already sign in with <strong>${esc(em)}</strong> and the password you chose.</p>
        <p style="margin:0"><a class="btn" href="#/login">${t("Sign in")}</a> <a class="btn ghost" href="#/home">Back to home</a></p></div>`;
      window.scrollTo(0, 0); return;
    }
    if (kind === "contact") { await api("/contact", { method: "POST", body: d }); f.reset(); toast(lang === "sw" ? "Ujumbe wako umetumwa." : "Your message has been sent. We will reply by email."); return; }
    if (kind === "subscribe") { await api("/subscribe", { method: "POST", body: d }); f.reset(); toast(lang === "sw" ? "Umejiunga kikamilifu." : "You are subscribed."); return; }
    if (kind === "chpw") { await api("/password", { method: "POST", body: { old: d.old, pw: d.pw, pw2: d.pw2 } }); f.reset(); toast("Password updated."); }
  } catch (err) { toast(err.message, true); }
  finally { if (btn) btn.disabled = false; }
});

window.addEventListener("hashchange", render);
refresh().catch(err => toast(err.message, true)).then(render);
</script>
</body>
</html>
